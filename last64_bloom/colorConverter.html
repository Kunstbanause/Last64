<!DOCT    body { 
        font-family: sans-serif; 
        margin: 40px;
        max-width: 500px; /* Limit overall page width */
        margin-left: auto;
        margin-right: auto;
    }
    textarea { 
        width: 100%; 
        height: 80px;
        box-sizing: border-box; /* Include padding in width */
        resize: vertical;
    }
    pre { 
        background: #f0f0f0; 
        padding: 10px; 
        white-space: pre-wrap; 
        overflow-x: auto; 
    } html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tiny3d HDR Color Converter</title>
<style>
    body { font-family: sans-serif; margin: 40px; }
    textarea { width: 100%; height: 80px; }
    pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; overflow-x: auto; }
    .color-preview { display: inline-block; width: 20px; height: 20px; margin-right: 8px; vertical-align: middle; border: 1px solid #000; }
    .color-preview:first-of-type { border: 1px solid #44444456; } /* Original color */
    .color-preview:nth-of-type(2) { border: 1px solid #44444456; } /* Scaled color */
    .container { 
        display: flex; 
        gap: 20px; 
        margin-top: 20px;
        justify-content: flex-start; /* Align to the left */
        max-width: fit-content; /* Don't expand beyond content */
        margin-left: auto;
        margin-right: auto;
    }
    .column { 
        width: 200px; /* Roughly: 2 color previews (20px * 2) + spacing (8px * 3) + text width (~144px) */
        flex: 0 0 auto; /* Don't grow or shrink */
    }
    ul { 
        list-style: none; 
        padding-left: 0; 
        margin-top: 0;
        max-width: 100%; /* Keep within column width */
    }
    li { margin: 0px 0; }
    button { 
        margin-top: 10px; 
        padding: 5px 10px;
        width: 100%;
        box-sizing: border-box;
    }
    label { 
        display: block; 
        margin: 10px 0;
        font-size: 14px;
    }
    input[type="range"] { 
        width: 100%; 
        margin: 5px 0;
        box-sizing: border-box;
    }
    h1 {
        text-align: center;
        font-size: 24px;
    }
    p {
        text-align: center;
        font-size: 14px;
    }
</style>
</head>
<body>
<h1>HDR Color Converter</h1>

<p>Palette and Shade: hex colors (#RRGGBB to RGBA8)</p>
<textarea id="inputColors">85daeb 5fc9e7 5fa1e7 5f6ee7 4c60aa 444774 32313b 463c5e 5d4776 855395 ab58a8 ca60ae f3a787 f5daa7 8dd894 5dc190 4ab9a3 4593a5 5efdf7 ff5dcc fdfe89 ffffff</textarea>
<div class="container">
    <div class="column">
        <pre id="cArrayOutput" style="display: none;"></pre>
        <!-- <h3>RGBA8 </h3> -->
        <button id="copyPalette">Copy Palette</button>
        <label>Scale: <span id="scaleValue">0.50</span> <input type="range" id="scaleSlider" min="0" max="1" step="0.01" value="0.5">
</label>
        <ul id="previewOutput"></ul>
    </div>
    <div class="column">
        <button id="copyInspector">Copy Shades</button>
        <label>Color: <span id="colorIndex">1</span> / <span id="colorTotal">0</span>
            <input type="range" id="colorSlider" min="0" max="0" step="1" value="0">
        </label>
        <div id="inspectorOutput"></div>
    </div>
</div>

<hr>



<script>
function clamp(value) {
    return Math.max(0, Math.min(255, value));
}

function hexToRGBA8(hex, scale) {
    hex = hex.replace('#', '');
    if(hex.length !== 6) return null;
    let r = clamp(Math.round(parseInt(hex.substring(0,2),16) * scale));
    let g = clamp(Math.round(parseInt(hex.substring(2,4),16) * scale));
    let b = clamp(Math.round(parseInt(hex.substring(4,6),16) * scale));
    let a = 255;
    return {
        rgba8: `0x${r.toString(16).padStart(2,'0').toUpperCase()}${g.toString(16).padStart(2,'0').toUpperCase()}${b.toString(16).padStart(2,'0').toUpperCase()}${a.toString(16).padStart(2,'0').toUpperCase()}`,
        r, g, b, a
    };
}

function updateColorSlider(colors) {
    const slider = document.getElementById('colorSlider');
    slider.max = colors.length - 1;
    document.getElementById('colorTotal').textContent = colors.length;
    document.getElementById('colorIndex').textContent = (parseInt(slider.value) + 1);
}

function updateColors() {
    const input = document.getElementById('inputColors').value;
    const scale = parseFloat(document.getElementById('scaleSlider').value);
    const separators = /[\n, ]+/;
    const colors = input.split(separators).map(s => s.trim()).filter(s => s);
    
    // Update color slider range
    updateColorSlider(colors);

    const convertedColors = colors.map(c => {
        const converted = hexToRGBA8(c, scale);
        return converted ? converted : null;
    }).filter(c => c !== null);

    // C array
    const cArray = `const uint32_t testColors[] = {\n    ${convertedColors.map(c => c.rgba8).join(',\n    ')}\n};`;
    document.getElementById('cArrayOutput').textContent = cArray;
    document.getElementById('cArrayOutput').dataset.array = cArray; // store for clipboard

    // Preview with both original and scaled colors
    const previewHtml = colors.map((hex, i) => {
        const original = hexToRGBA8(hex, 1.0); // Original color (scale = 1.0)
        const scaled = convertedColors[i];      // Scaled color
        return `<li>
            <span class="color-preview" style="background-color: rgb(${original.r},${original.g},${original.b});"></span>
            <span class="color-preview" style="background-color: rgb(${scaled.r},${scaled.g},${scaled.b});"></span>
            ${scaled.rgba8}
        </li>`;
    }).join('');
    document.getElementById('previewOutput').innerHTML = previewHtml;

    updateInspector();
}

function updateScaleValue(val) {
    document.getElementById('scaleValue').textContent = parseFloat(val).toFixed(2);
    updateColors();
}

function updateInspector() {
    // Get the current color from the palette based on slider
    const input = document.getElementById('inputColors').value;
    const separators = /[\n, ]+/;
    const colors = input.split(separators).map(s => s.trim()).filter(s => s);
    const selectedIndex = parseInt(document.getElementById('colorSlider').value);
    const hex = colors[selectedIndex];
    
    if (!hex || !/^#?[0-9a-fA-F]{6}$/.test(hex)) {
        document.getElementById('inspectorOutput').innerHTML = "<p>No valid color selected.</p>";
        return;
    }
    const scales = [];
    for(let i=1; i<=20; i++) scales.push(i*0.05); // 0.1 to 1
    
    const arrayValues = [];
    const listHtml = '<ul>' + scales.map(s => {
        const original = hexToRGBA8(hex, 1.0); // Original color
        const scaled = hexToRGBA8(hex, s);     // Scaled color
        arrayValues.push(scaled.rgba8);
        return `<li>
            ${s.toFixed(2)}x
            <span class="color-preview" style="background-color: rgb(${scaled.r},${scaled.g},${scaled.b});"></span>
            ${scaled.rgba8}
        </li>`;
    }).join('') + '</ul>';
    
    document.getElementById('inspectorOutput').innerHTML = listHtml;
    document.getElementById('inspectorOutput').dataset.array = `const uint32_t testColors[] = {\n    ${arrayValues.join(',\n    ')}\n};`;
}

// Copy to clipboard
function copyToClipboard(id) {
    const element = document.getElementById(id);
    const text = element.dataset.array;
    if(!text) return;
    navigator.clipboard.writeText(text).then(() => {
        // alert("Copied to clipboard!");
    });
}

// Event listeners
document.getElementById('inputColors').addEventListener('input', updateColors);
document.getElementById('scaleSlider').addEventListener('input', e => updateScaleValue(e.target.value));
document.getElementById('colorSlider').addEventListener('input', e => {
    document.getElementById('colorIndex').textContent = (parseInt(e.target.value) + 1);
    updateInspector();
});

document.getElementById('copyPalette').addEventListener('click', () => copyToClipboard('cArrayOutput'));
document.getElementById('copyInspector').addEventListener('click', () => copyToClipboard('inspectorOutput'));

// Initialize
updateColors();
</script>
</body>
</html>
