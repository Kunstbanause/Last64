<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tiny3d HDR Color Converter</title>
<style>
    body { font-family: sans-serif; margin: 40px; }
    textarea { width: 100%; height: 80px; }
    pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; overflow-x: auto; }
    .color-preview { display: inline-block; width: 20px; height: 20px; margin-right: 8px; vertical-align: middle; border: 1px solid #000; }
    .container { display: flex; gap: 20px; margin-top: 20px; }
    .column { flex: 1; }
    ul { list-style: none; padding-left: 0; margin-top: 0; }
    table { border-collapse: collapse; margin-top: 10px; width: 100%; }
    td, th { border: 1px solid #ccc; padding: 5px 10px; text-align: center; }
    button { margin-top: 10px; padding: 5px 10px; }
</style>
</head>
<body>
<h1>tiny3d HDR Color Converter</h1>

<p>Palette Conversion: hex colors (#RRGGBB or no#), separated by: newlines, comma, space:</p>
<textarea id="inputColors">85daeb 5fc9e7 5fa1e7 5f6ee7 4c60aa 444774 32313b 463c5e 5d4776 855395 ab58a8 ca60ae f3a787 f5daa7 8dd894 5dc190 4ab9a3 4593a5 5efdf7 ff5dcc fdfe89 ffffff</textarea>
<br>
<label>Brightness Scale: <span id="scaleValue">0.50</span></label>
<br>
<input type="range" id="scaleSlider" min="0" max="1" step="0.01" value="0.5">

<div class="container">
    <div class="column">
        <button id="copyPalette">Copy Palette C Array</button>
        <pre id="cArrayOutput" style="display: none;"></pre>
        <h3>Preview</h3>
        <ul id="previewOutput"></ul>
    </div>
    <div class="column">
        <button id="copyInspector">Copy Inspector C Array</button>
        <h3>Single Hex Inspector</h3>
        <!-- <label>Enter a hex color (#RRGGBB or RRGGBB): </label> -->
        <input type="text" id="inspectHex" value="85DAEB">
        <br>
        <div id="inspectorOutput"></div>
    </div>
</div>

<hr>



<script>
function clamp(value) {
    return Math.max(0, Math.min(255, value));
}

function hexToRGBA8(hex, scale) {
    hex = hex.replace('#', '');
    if(hex.length !== 6) return null;
    let r = clamp(Math.round(parseInt(hex.substring(0,2),16) * scale));
    let g = clamp(Math.round(parseInt(hex.substring(2,4),16) * scale));
    let b = clamp(Math.round(parseInt(hex.substring(4,6),16) * scale));
    let a = 255;
    return {
        rgba8: `0x${r.toString(16).padStart(2,'0').toUpperCase()}${g.toString(16).padStart(2,'0').toUpperCase()}${b.toString(16).padStart(2,'0').toUpperCase()}${a.toString(16).padStart(2,'0').toUpperCase()}`,
        r, g, b, a
    };
}

function updateColors() {
    const input = document.getElementById('inputColors').value;
    const scale = parseFloat(document.getElementById('scaleSlider').value);
    const separators = /[\n, ]+/;
    const colors = input.split(separators).map(s => s.trim()).filter(s => s);

    const convertedColors = colors.map(c => {
        const converted = hexToRGBA8(c, scale);
        return converted ? converted : null;
    }).filter(c => c !== null);

    // C array
    const cArray = `const uint32_t palette[] = {\n    ${convertedColors.map(c => c.rgba8).join(',\n    ')}\n};`;
    document.getElementById('cArrayOutput').textContent = cArray;
    document.getElementById('cArrayOutput').dataset.array = cArray; // store for clipboard

    // Preview
    const previewHtml = convertedColors.map(c => 
        `<li><span class="color-preview" style="background-color: rgb(${c.r},${c.g},${c.b});"></span> ${c.rgba8}</li>`
    ).join('');
    document.getElementById('previewOutput').innerHTML = previewHtml;

    updateInspector();
}

function updateScaleValue(val) {
    document.getElementById('scaleValue').textContent = parseFloat(val).toFixed(2);
    updateColors();
}

function updateInspector() {
    const hex = document.getElementById('inspectHex').value.trim();
    if(!/^#?[0-9a-fA-F]{6}$/.test(hex)) {
        document.getElementById('inspectorOutput').innerHTML = "<p>Enter a valid hex color.</p>";
        return;
    }
    const scales = [];
    for(let i=1; i<=10; i++) scales.push(i*0.1); // 0.1 to 1.0
    let tableHtml = '<table><tr><th>Scale</th><th>RGBA8</th><th>Preview</th></tr>';
    const arrayValues = [];
    scales.forEach(s => {
        const c = hexToRGBA8(hex, s);
        tableHtml += `<tr>
            <td>${s.toFixed(1)}</td>
            <td>${c.rgba8}</td>
            <td><span class="color-preview" style="background-color: rgb(${c.r},${c.g},${c.b});"></span></td>
        </tr>`;
        arrayValues.push(c.rgba8);
    });
    tableHtml += '</table>';
    document.getElementById('inspectorOutput').innerHTML = tableHtml;
    document.getElementById('inspectorOutput').dataset.array = `const uint32_t inspector[] = {\n    ${arrayValues.join(',\n    ')}\n};`;
}

// Copy to clipboard
function copyToClipboard(id) {
    const element = document.getElementById(id);
    const text = element.dataset.array;
    if(!text) return;
    navigator.clipboard.writeText(text).then(() => {
        // alert("Copied to clipboard!");
    });
}

// Event listeners
document.getElementById('inputColors').addEventListener('input', updateColors);
document.getElementById('scaleSlider').addEventListener('input', e => updateScaleValue(e.target.value));
document.getElementById('inspectHex').addEventListener('input', updateInspector);

document.getElementById('copyPalette').addEventListener('click', () => copyToClipboard('cArrayOutput'));
document.getElementById('copyInspector').addEventListener('click', () => copyToClipboard('inspectorOutput'));

// Initialize
updateColors();
</script>
</body>
</html>
