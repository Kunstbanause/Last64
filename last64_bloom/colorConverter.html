<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>tiny3d HDR Color Converter - Side-by-Side</title>
<style>
    body { font-family: sans-serif; margin: 40px; }
    textarea { width: 100%; height: 150px; }
    input, button { margin: 10px 0; }
    pre { background: #f0f0f0; padding: 10px; white-space: pre-wrap; overflow-x: auto; }
    .color-preview { display: inline-block; width: 20px; height: 20px; margin-right: 8px; vertical-align: middle; border: 1px solid #000; }
    .container { display: flex; gap: 20px; margin-top: 20px; }
    .column { flex: 1; }
    ul { list-style: none; padding-left: 0; margin-top: 0; }
</style>
</head>
<body>
<h1>tiny3d HDR Color Converter - Side-by-Side</h1>
<p>Paste hex colors (#RRGGBB or RRGGBB) separated by newlines or commas:</p>
<textarea id="inputColors"></textarea>
<br>
<label>Brightness Scale: <span id="scaleValue">0.50</span></label>
<br>
<input type="range" id="scaleSlider" min="0" max="1" step="0.01" value="0.5" oninput="updateScaleValue(this.value)">
<br>
<button onclick="convertColors()">Convert</button>

<div class="container">
    <div class="column">
        <h2>C Array</h2>
        <pre id="cArrayOutput"></pre>
    </div>
    <div class="column">
        <h2>Preview</h2>
        <ul id="previewOutput"></ul>
    </div>
</div>

<script>
function clamp(value) {
    return Math.max(0, Math.min(255, value));
}

function hexToRGBA8(hex, scale) {
    hex = hex.replace('#', '');
    if(hex.length !== 6) return null;
    let r = clamp(Math.round(parseInt(hex.substring(0,2),16) * scale));
    let g = clamp(Math.round(parseInt(hex.substring(2,4),16) * scale));
    let b = clamp(Math.round(parseInt(hex.substring(4,6),16) * scale));
    let a = 255;
    return {
        rgba8: `0x${r.toString(16).padStart(2,'0').toUpperCase()}${g.toString(16).padStart(2,'0').toUpperCase()}${b.toString(16).padStart(2,'0').toUpperCase()}${a.toString(16).padStart(2,'0').toUpperCase()}`,
        r, g, b, a
    };
}

function convertColors() {
    const input = document.getElementById('inputColors').value;
    const scale = parseFloat(document.getElementById('scaleSlider').value);
    const separators = /[\n,]+/;
    const colors = input.split(separators).map(s => s.trim()).filter(s => s);
    
    const convertedColors = colors.map(c => {
        const converted = hexToRGBA8(c, scale);
        return converted ? converted : null;
    }).filter(c => c !== null);

    // Generate C array
    const cArray = `const uint32_t palette[] = {\n    ${convertedColors.map(c => c.rgba8).join(',\n    ')}\n};`;
    document.getElementById('cArrayOutput').textContent = cArray;

    // Generate preview list
    const previewHtml = convertedColors.map(c => 
        `<li><span class="color-preview" style="background-color: rgb(${c.r},${c.g},${c.b});"></span> ${c.rgba8}</li>`
    ).join('');
    document.getElementById('previewOutput').innerHTML = previewHtml;
}

function updateScaleValue(val) {
    document.getElementById('scaleValue').textContent = parseFloat(val).toFixed(2);
}
</script>
</body>
</html>
